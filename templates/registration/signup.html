<!DOCTYPE html>
<html>
<head>
    <title>Signup</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        :root {
            --bg: #f5f5f5;
            --card: white;
            --text: black;
        }

        body.dark {
            --bg: #121212;
            --card: #1e1e1e;
            --text: white;
        }

        .card {
            background: var(--card);
            padding: 40px;
            border-radius: 12px;
            width: 320px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #2e7d32;
        }

        .field {
            position: relative;
            margin-bottom: 20px;
        }

        .field input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: transparent;
            color: inherit;
        }

        .field label {
            position: absolute;
            top: 10px;
            left: 10px;
            color: gray;
            font-size: 14px;
            transition: 0.2s;
            background: var(--card);
            padding: 0 5px;
        }

        .field input:focus + label,
        .field input:not(:placeholder-shown) + label {
            top: -8px;
            font-size: 12px;
            color: #2e7d32;
        }

        .eye {
            position: absolute;
            right: 10px;
            top: 10px;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
        }

        .error {
            color: red;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .login-link {
            text-align: center;
            margin-top: 10px;
        }

        .login-link a {
            color: #2e7d32;
            text-decoration: none;
            font-weight: bold;
        }

        .toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<i class="fa-solid fa-moon toggle" onclick="toggleDark()"></i>

<div class="card">

    <h2>Signup</h2>

    {% if form.errors %}
        <div class="error">
            Please fix the errors below
        </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <!-- Username -->
        <div class="field">
            <input type="text" name="username" required placeholder=" ">
            <label>Username</label>
        </div>

        <!-- Password -->
        <div class="field">
            <input type="password" id="pass1" name="password1" required placeholder=" ">
            <label>Password</label>
            <i class="fa-solid fa-eye eye" onclick="togglePass('pass1')"></i>
        </div>

        <!-- Confirm Password -->
        <div class="field">
            <input type="password" id="pass2" name="password2" required placeholder=" ">
            <label>Confirm Password</label>
            <i class="fa-solid fa-eye eye" onclick="togglePass('pass2')"></i>
        </div>

        <button type="submit">Create Account</button>
    </form>

    <div class="login-link">
        <p>Already have an account?</p>
        <a href="/accounts/login/">Login</a>
    </div>

</div>

<script>
function togglePass(id) {
    let input = document.getElementById(id);
    input.type = input.type === "password" ? "text" : "password";
}

function toggleDark() {
    document.body.classList.toggle("dark");
}
</script>

</body>
</html>
