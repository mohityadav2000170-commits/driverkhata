<!DOCTYPE html>
<html>
<head>
    <title>Auth</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            /* 🔥 CLEAN GRADIENT */
            background: linear-gradient(135deg, #1e3c72, #2a5298);
        }

        .card {
            width: 320px;
            padding: 25px;
            border-radius: 16px;

            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(15px);

            box-shadow: 0 8px 30px rgba(0,0,0,0.3);

            animation: fadeUp 0.5s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            text-align: center;
            color: white;
            margin-bottom: 20px;
        }

        .field {
            position: relative;
            margin-bottom: 18px;
        }

        .field input {
            width: 100%;
            padding: 12px 40px 12px 12px;
            border-radius: 8px;
            border: none;
            outline: none;
            font-size: 14px;
        }

        .field i {
            position: absolute;
            right: 12px;
            top: 12px;
            color: #555;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #00c853;
            color: white;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #00b248;
        }

        button:active {
            transform: scale(0.96);
        }

        .link {
            text-align: center;
            margin-top: 15px;
            color: white;
            font-size: 14px;
        }

        .link a {
            color: #00e676;
            text-decoration: none;
            font-weight: bold;
        }

        .error {
            color: #ff5252;
            font-size: 13px;
            margin-bottom: 10px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="card">

    <h2>Login</h2>

    {% if form.errors %}
        <div class="error">Invalid credentials</div>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <div class="field">
            <input type="text" name="username" placeholder="Username" required>
        </div>

        <div class="field">
            <input type="password" id="pass" name="password" placeholder="Password" required>
            <i class="fa-solid fa-eye" onclick="togglePass()"></i>
        </div>

        <button type="submit">Login</button>
    </form>

    <div class="link">
        Don't have an account? <a href="/signup/">Signup</a>
    </div>

</div>

<script>
function togglePass() {
    let p = document.getElementById("pass");
    p.type = p.type === "password" ? "text" : "password";
}
</script>

</body>
</html>
