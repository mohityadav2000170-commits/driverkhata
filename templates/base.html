<!DOCTYPE html>
<html>
<head>
    <title>Driver Khata</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>



                body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;

            /* 🌄 Background image */
            background: url("https://images.unsplash.com/photo-1506744038136-46273834b3fb") no-repeat center center fixed;
            background-size: cover;
        }

        /* 🌫️ Dark overlay */
        body::before {
            content: "";
            position: fixed;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.55);
            z-index: -1;
        }

        /* Content stays above overlay */
        .container, .card {
            position: relative;
            z-index: 1;
        }
        .card {
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(8px);
    border-radius: 12px;
}
        body {
            margin: 0;
            font-family: Arial;
            background: var(--bg);
            color: var(--text);
        }

        :root {
            --bg: #f5f5f5;
            --card: white;
            --text: black;
        }

        body.dark {
            --bg: #121212;
            --card: #1e1e1e;
            --text: white;
        }

        .header {
            background: #2e7d32;
            color: white;
            padding: 15px;
            font-size: 18px;
            display: flex;
            justify-content: space-between;
        }

        .container {
            padding: 15px;
        }

        .card {
            background: var(--card);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .income { color: #2e7d32; font-weight: bold; }
        .expense { color: red; font-weight: bold; }

        .fab {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #2e7d32;
            color: white;
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-size: 24px;
        }

        .toggle {
            cursor: pointer;
        }
        table {
            font-size: 14px;
        }
        th {
            padding: 8px;
        }
        td {
            padding: 6px;
        }

                .card {
            animation: slideUp 0.4s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        button {
            transition: 0.2s;
        }

        button:active {
            transform: scale(0.95);
        }
       .fab {
    animation: bounce 2s infinite;
}

@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
}
body {
    animation: fadePage 0.3s ease;
}

@keyframes fadePage {
    from { opacity: 0; }
    to { opacity: 1; }
}

.road {
    position: fixed;
    bottom: 20px;
    width: 100%;
    height: 80px;
    overflow: hidden;
    z-index: 0;
}

.car {
    position: absolute;
    font-size: 40px;
    animation: drive 6s linear infinite;
}

@keyframes drive {
    0% {
        left: -10%;
    }
    100% {
        left: 110%;
    }
}
</style>
        
   
</head>

<body>

    

<div class="header">
    🚗 Driver Khata

    <div>
        <!-- 🌙 Dark Mode -->
        <i class="fa-solid fa-moon toggle" onclick="toggleDark()"></i>

        <!-- 🔓 Logout -->
        <form action="/accounts/logout/" method="post" style="display:inline;">
            {% csrf_token %}
            <button style="background:none; border:none; color:white;">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>
        </form>
    </div>
</div>

<div class="container">
    {% block content %}{% endblock %}
</div>

<!-- ➕ Add Button -->
<button class="fab" onclick="location.href='/add/'">
    <i class="fa-solid fa-plus"></i>
</button>

<script>
function toggleDark() {
    document.body.classList.toggle("dark");
}
</script>

<video autoplay muted loop id="bg-video">
   <source src="https://cdn.coverr.co/videos/coverr-road-trip-1579/1080p.mp4" type="video/mp4">
</video>

</body>
</html>
