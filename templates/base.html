<!DOCTYPE html>
<html>
<head>
    <title>Driver Khata</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f5f5f5;
        }

        .header {
            background: #2e7d32;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 20px;
        }

        .container {
            padding: 15px;
        }

        .card {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .fab {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: green;
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-size: 30px;
            border: none;
        }
    </style>

    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#2e7d32">
    <link rel="icon" href="/static/icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>

<div class="header">
    🚗 Driver Khata
</div>

<div class="container">
    {% block content %}{% endblock %}
</div>

<button class="fab" onclick="location.href='/add/'">+</button>

</body>
</html>
