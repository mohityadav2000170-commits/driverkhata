<!DOCTYPE html>
<html>
<head>
    <title>Driver Khata</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: var(--bg);
            color: var(--text);
        }

        :root {
            --bg: #f5f5f5;
            --card: white;
            --text: black;
        }

        body.dark {
            --bg: #121212;
            --card: #1e1e1e;
            --text: white;
        }

        .header {
            background: #2e7d32;
            color: white;
            padding: 15px;
            font-size: 18px;
            display: flex;
            justify-content: space-between;
        }

        .container {
            padding: 15px;
        }

        .card {
            background: var(--card);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .income { color: #2e7d32; font-weight: bold; }
        .expense { color: red; font-weight: bold; }

        .fab {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #2e7d32;
            color: white;
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-size: 24px;
        }

        .toggle {
            cursor: pointer;
        }
        table {
            font-size: 14px;
        }
        th {
            padding: 8px;
        }
        td {
            padding: 6px;
        }
    </style>
</head>

<body>

<div class="header">
    🚗 Driver Khata

    <div>
        <!-- 🌙 Dark Mode -->
        <i class="fa-solid fa-moon toggle" onclick="toggleDark()"></i>

        <!-- 🔓 Logout -->
        <form action="/accounts/logout/" method="post" style="display:inline;">
            {% csrf_token %}
            <button style="background:none; border:none; color:white;">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>
        </form>
    </div>
</div>

<div class="container">
    {% block content %}{% endblock %}
</div>

<!-- ➕ Add Button -->
<button class="fab" onclick="location.href='/add/'">
    <i class="fa-solid fa-plus"></i>
</button>

<script>
function toggleDark() {
    document.body.classList.toggle("dark");
}
</script>

</body>
</html>
