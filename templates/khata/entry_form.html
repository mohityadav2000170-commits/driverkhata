<!DOCTYPE html>
<html>
<head>
    <title>Add Entry</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: white;
            padding: 80px;
            width: 320px;
            border-radius: 14px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .amount {
            width: 100%;
            font-size: 28px;
            text-align: center;
            border: none;
            border-bottom: 2px solid #ddd;
            padding: 10px;
            margin-bottom: 20px;
        }

        .field {
            position: relative;
            margin-bottom: 15px;
        }

        .field i {
            position: absolute;
            top: 10px;
            left: 10px;
            color: gray;
        }

        .field input {
            width: 100%;
            padding: 10px 10px 10px 35px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .debit {
            background: #ffebee;
            color: red;
        }

        .credit {
            background: #e8f5e9;
            color: green;
        }
    </style>
</head>

<body>

<div class="card">

    <h2><i class="fa-solid fa-plus"></i> Add Entry</h2>

    <form method="post">
        {% csrf_token %}

        <!-- Amount -->
        <input type="number" name="amount" class="amount" placeholder="₹ Enter Amount" required>

        <!-- Phone -->
        <div class="field">
            <i class="fa-solid fa-phone"></i>
            <input type="text" name="phone" placeholder="Phone (optional)">
        </div>

        <!-- Note -->
        <div class="field">
            <i class="fa-solid fa-pen"></i>
            <input type="text" name="note" placeholder="Note (optional)">
        </div>

        <input type="hidden" name="type" id="type">

        <!-- Buttons -->
        <div class="buttons">
            <button type="submit" class="debit" onclick="setType('ADD')">
                ➖ Debit
            </button>

            <button type="submit" class="credit" onclick="setType('PAY')">
                ➕ Credit
            </button>
        </div>

    </form>

</div>

<script>
function setType(value) {
    document.getElementById("type").value = value;
}
</script>

</body>
</html>
