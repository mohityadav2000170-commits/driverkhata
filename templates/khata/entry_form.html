<!DOCTYPE html>
<html>
<head>
    <title>Add Entry</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  </head>
    <style>

        html, body {
    height: 100%;
    overflow: hidden;
}
   /* 🎥 Background video */
#bg-video {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -2;
}

/* 🌫️ Dark overlay */
body::before {
    content: "";
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    z-index: -1;
}

/* 🌍 Center content */
body {
    margin: 0;
    font-family: Arial;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* 🧊 Glass card */
.card {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(12px);
    padding: 70px;
    width: 320px;
    border-radius: 14px;
    color: white;
    box-shadow: 0 8px 30px rgba(0,0,0,0.3);
}

/* Title */
h2 {
    text-align: center;
    margin-bottom: 20px;
}

/* Amount */
.amount {
    width: 100%;
    font-size: 28px;
    text-align: center;
    border: none;
    border-bottom: 2px solid rgba(255,255,255,0.5);
    padding: 10px;
    margin-bottom: 20px;
    background: transparent;
    color: white;
}

/* Input field wrapper */
.field {
    position: relative;
    margin-bottom: 15px;
}

/* Icons inside input */
.field i {
    position: absolute;
    top: 12px;
    left: 10px;
    color: #ccc;
}

/* Inputs */
.field input {
    width: 100%;
    padding: 10px 10px 10px 35px;
    border-radius: 6px;
    border: none;
    background: rgba(255,255,255,0.2);
    color: white;
}

/* Placeholder color */
::placeholder {
    color: #ddd;
}

/* Buttons container */
.buttons {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

/* Buttons */
.buttons button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

/* Debit */
.debit {
    background: rgba(255,0,0,0.2);
    color: #ff6b6b;
}

/* Credit */
.credit {
    background: rgba(0,255,0,0.2);
    color: #4caf50;
}
    </style>


<body>

   <video autoplay muted loop playsinline id="bg-video">
    <source src="https://www.w3schools.com/howto/rain.mp4" type="video/mp4">
    </video>

<div class="card">

    <h2><i class="fa-solid fa-plus"></i> Add Entry</h2>

    <form method="post">
        {% csrf_token %}

        <!-- Amount -->
        <input type="number" name="amount" class="amount" placeholder="₹ Enter Amount" required>

        <!-- Phone -->
        <div class="field">
            <i class="fa-solid fa-phone"></i>
            <input type="text" name="phone" placeholder="Phone (optional)">
        </div>

        <!-- Note -->
        <div class="field">
            <i class="fa-solid fa-pen"></i>
            <input type="text" name="note" placeholder="Note (optional)">
        </div>

        <input type="hidden" name="type" id="type">

        <!-- Buttons -->
        <div class="buttons">
            <button type="submit" class="debit" onclick="setType('ADD')">
                ➖ Debit
            </button>

            <button type="submit" class="credit" onclick="setType('PAY')">
                ➕ Credit
            </button>
        </div>

    </form>

</div>

<script>
function setType(value) {
    document.getElementById("type").value = value;
}
</script>

</body>
</html>
